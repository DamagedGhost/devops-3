name: CI/CD INNOVATECH - Producción EKS

on:
  push:
    branches: [ "deploy" ]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # ETAPA 1: BUILD & PUSH FRONTEND
  # ==========================================
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push - Frontend
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        cd front_despacho
        docker build -t $REGISTRY/front:${{ env.IMAGE_TAG }} -t $REGISTRY/front:latest .
        docker push -a $REGISTRY/front

  # ==========================================
  # ETAPA 2: BUILD & PUSH BACKEND VENTAS
  # ==========================================
  build-backend-ventas:
    name: Build & Push Ventas
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push - Ventas
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        cd back-Ventas_SpringBoot/Springboot-API-REST
        docker build -t $REGISTRY/back-ventas:${{ env.IMAGE_TAG }} -t $REGISTRY/back-ventas:latest .
        docker push -a $REGISTRY/back-ventas

  # ==========================================
  # ETAPA 3: BUILD & PUSH BACKEND DESPACHOS
  # ==========================================
  build-backend-despachos:
    name: Build & Push Despachos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build & Push - Despachos
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker build -t $REGISTRY/back-despachos:${{ env.IMAGE_TAG }} -t $REGISTRY/back-despachos:latest .
        docker push -a $REGISTRY/back-despachos

  # ==========================================
  # ETAPA 4: DEPLOY EN EKS
  # ==========================================
  deploy-eks:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend-ventas, build-backend-despachos]

    steps:
    # NUEVO: sin esto no puedes acceder a los YAMLs del repo
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Actualizar credenciales de EKS
      run: |
        aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name EKS-prueba

    # NUEVO: aplica los manifests en orden de dependencia
    # Ajusta las rutas según dónde estén tus YAMLs en el repo
    - name: Aplicar manifiestos de Kubernetes
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/init-db.yaml
        kubectl apply -f k8s/database.yaml
        kubectl apply -f k8s/backend.yaml
        kubectl apply -f k8s/frontend.yaml
        kubectl apply -f k8s/hpa.yaml

    - name: Forzar rolling update con nueva imagen
      run: |
        kubectl rollout restart deployment backend-venta backend-despacho frontend-app -n innovatech

    # NUEVO: espera a que los pods estén realmente listos antes de reportar success
    # 300s es suficiente para la startupProbe (máx 300s) + margen
    - name: Verificar deploy exitoso
      run: |
        kubectl rollout status deployment/backend-venta -n innovatech --timeout=400s
        kubectl rollout status deployment/backend-despacho -n innovatech --timeout=400s
        kubectl rollout status deployment/frontend-app -n innovatech --timeout=60s