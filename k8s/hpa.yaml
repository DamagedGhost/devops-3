apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: innovatech-hpa
  namespace: innovatech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: innovatech-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
# !evaluar si se puede agregar varias metricas de diferentes contenedores