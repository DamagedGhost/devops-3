# ==========================================
# MICROSERVICIO: VENTA
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-venta
  namespace: innovatech
spec:
  selector:
    matchLabels:
      app: backend-venta
  template:
    metadata:
      labels:
        app: backend-venta
    spec:
      terminationGracePeriodSeconds: 40  # mayor que preStop sleep + tiempo de requests en vuelo
      containers:
      - name: venta
        image: 686631061929.dkr.ecr.us-east-1.amazonaws.com/back-ventas:latest
        ports:
        - containerPort: 8080
        lifecycle:
          preStop:
            exec:
              # Drena requests en vuelo antes de que K8s envíe SIGTERM
              # Esto elimina los 502 durante rolling updates
              command: ["sh", "-c", "sleep 10"]
        # startupProbe: le da tiempo a Spring para arrancar sin que liveness lo mate
        # 30 intentos * 10s = 300s máximo de startup. No afecta readiness ni liveness.
        startupProbe:
          httpGet:
            path: /actuator/health  # si no tienen actuator, usar tcpSocket port 8080
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        # readinessProbe: solo se activa DESPUÉS de que startupProbe pase
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        # livenessProbe: mata el pod si ya levantó pero se colgó
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
        resources:
          requests:
            cpu: "200m"    # subimos: la JVM necesita CPU para el JIT en arranque
            memory: "256Mi"
          limits:
            cpu: "600m"
            memory: "768Mi"
        env:
        - name: DB_ENDPOINT
          value: "innovatech-db-svc"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "innovatech_db"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-venta-svc
  namespace: innovatech
spec:
  type: ClusterIP
  selector:
    app: backend-venta
  ports:
  - port: 8080
    targetPort: 8080
---
# ==========================================
# MICROSERVICIO: DESPACHO
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despacho
  namespace: innovatech
spec:
  selector:
    matchLabels:
      app: backend-despacho
  template:
    metadata:
      labels:
        app: backend-despacho
    spec:
      terminationGracePeriodSeconds: 40
      containers:
      - name: despacho
        image: 686631061929.dkr.ecr.us-east-1.amazonaws.com/back-despachos:latest
        ports:
        - containerPort: 8080
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "600m"
            memory: "768Mi"
        env:
        - name: DB_ENDPOINT
          value: "innovatech-db-svc"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "innovatech_db"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-despacho-svc
  namespace: innovatech
spec:
  type: ClusterIP
  selector:
    app: backend-despacho
  ports:
  - port: 8080
    targetPort: 8080