# ==========================================
# MICROSERVICIO: VENTA
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-venta
  namespace: innovatech
spec:
  selector:
    matchLabels:
      app: backend-venta
  template:
    metadata:
      labels:
        app: backend-venta
    spec:
      containers:
      - name: venta
        image: 686631061929.dkr.ecr.us-east-1.amazonaws.com/back-ventas:latest # REEMPLAZAR
        ports:
        - containerPort: 8080
        # EL SEGURO DE VIDA: Pruebas de salud
        readinessProbe:
          tcpSocket:
            port: 8080 # (8081 para despachos)
          initialDelaySeconds: 20 # K8s esperará 20 seg antes de probar
          periodSeconds: 10       # Re-probará cada 10 seg
        livenessProbe:
          tcpSocket:
            port: 8080 # (8081 para despachos)
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: "100m"      # Bajamos de 250m a 100m
            memory: "256Mi" # Bajamos de 512Mi a 128Mi
          limits:
            cpu: "600m"
            memory: "768Mi"
        env:
        - name: DB_ENDPOINT
          value: "innovatech-db-svc" # El DNS interno de tu base de datos en K8s
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "innovatech_db"
        # Cumpliendo con el IE5: Gestión de Secrets
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secret
              key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-venta-svc
  namespace: innovatech
spec:
  type: ClusterIP
  selector:
    app: backend-venta
  ports:
  - port: 8080
    targetPort: 8080

---
# ==========================================
# MICROSERVICIO: DESPACHO
